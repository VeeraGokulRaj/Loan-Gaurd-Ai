<!-- Card 4: Related Exceptions (if any) -->
{% if related_exceptions %}
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur-xl space-y-4">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
            <svg class="w-4 h-4 text-amber-400"
                 fill="none"
                 stroke="currentColor"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                </path>
            </svg>
            Other Exceptions Flagged on Same Loan Record ({{ related_exceptions|length }})
        </h3>
        <div class="space-y-2">
            {% for rel_exc in related_exceptions %}
                <div class="p-3 rounded-xl bg-slate-950/60 border border-slate-800/80 flex items-center justify-between text-xs">
                    <div class="flex items-center gap-3">
                        <a href="{% url 'exception_loan_detail' rel_exc.id %}"
                           class="font-mono font-bold text-indigo-400 hover:text-indigo-300 hover:underline transition-colors">#EXP-{{ rel_exc.id }}</a>
                        <span class="font-mono font-semibold text-white">{{ rel_exc.rule_code }}</span>
                        <span class="text-slate-400 truncate max-w-md">{{ rel_exc.description }}</span>
                    </div>
                    <a href="{% url 'exception_loan_detail' rel_exc.id %}"
                       class="text-indigo-400 hover:text-indigo-300 font-semibold hover:underline">View Detail →</a>
                </div>
            {% endfor %}
        </div>
    </div>
{% endif %}
