<!-- Clean Navigation Tabs Bar for Reviewer Workspace -->
<div class="border-b border-slate-800 flex items-center gap-6 text-sm font-medium">
    <button type="button"
            onclick="switchTab('exceptionsTab')"
            hx-get="{% url 'loan_exceptions_list' %}"
            hx-target="#exceptionsTab"
            hx-swap="outerHTML"
            id="subnav-exceptionsTab"
            class="subtab-btn active-subtab pb-3 border-b-2 font-semibold transition-colors duration-150 flex items-center gap-2 border-indigo-500 text-white">
        <svg class="w-4 h-4 text-indigo-400"
             fill="none"
             stroke="currentColor"
             viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
            </path>
        </svg>
        Loan Exceptions
        {% if open_exceptions > 0 %}
            <span class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">{{ open_exceptions }}</span>
        {% endif %}
    </button>
</div>
