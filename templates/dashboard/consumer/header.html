{% load static %}
<header class="bg-slate-900/90 border-b border-slate-800 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Brand Logo & Navigation Links -->
            <div class="flex items-center gap-6">
                <a href="{% url 'consumer_dashboard' %}" class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg shadow-emerald-500/20 ring-1 ring-white/20">
                        <svg class="w-6 h-6 text-white"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                            </path>
                        </svg>
                    </div>
                    <span class="text-xl font-bold text-white tracking-tight">LoanGuard AI</span>
                </a>
                <span class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    Data Consumer
                </span>
                <!-- Workspace Navigation Tabs -->
                <nav class="hidden md:flex items-center gap-1 ml-4">
                    <a href="{% url 'consumer_dashboard' %}"
                       class="px-3 py-2 rounded-lg text-xs font-medium transition-colors {% if request.resolver_match.url_name == 'consumer_dashboard' %}bg-slate-800 text-emerald-400 border border-slate-700{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50{% endif %}">
                        Dashboard Overview
                    </a>
                    <a href="{% url 'verified_loan_list' %}"
                       class="px-3 py-2 rounded-lg text-xs font-medium transition-colors {% if request.resolver_match.url_name == 'verified_loan_list' or request.resolver_match.url_name == 'verified_loan_detail' or request.resolver_match.url_name == 'verified_loan_history' or request.resolver_match.url_name == 'verified_loan_audit' %}bg-slate-800 text-emerald-400 border border-slate-700{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50{% endif %}">
                        Verified Records List
                    </a>
                </nav>
            </div>
            <!-- User Profile & Export Quick Button -->
            <div class="flex items-center gap-3">
                <a href="{% url 'verified_loan_export' %}?format=csv"
                   class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-600/20 border border-emerald-500/30 text-emerald-300 hover:bg-emerald-600/30 text-xs font-semibold transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v12m0-12l-3 3m3-3l3 3m5 5v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2">
                        </path>
                    </svg>
                    Export CSV
                </a>
                <div class="text-right hidden sm:block pl-2 border-l border-slate-800">
                    <div class="text-xs font-semibold text-white">{{ user.first_name|default:user.username }} {{ user.last_name }}</div>
                    <div class="text-[10px] text-slate-400">Data Consumer Portal</div>
                </div>
                <a href="{% url 'logout' %}"
                   class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
                   title="Sign Out">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                </a>
            </div>
        </div>
    </div>
</header>
