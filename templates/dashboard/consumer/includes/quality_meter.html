<div class="p-6 rounded-2xl bg-slate-900/90 border border-slate-800 shadow-xl backdrop-blur-md relative overflow-hidden">
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z">
                    </path>
                </svg>
            </div>
            <div>
                <h3 class="text-sm font-semibold text-white">Data Quality Score Index</h3>
                <p class="text-xs text-slate-400">Calculated as (Verified Records / Primary Loan Tape Records) × 100</p>
            </div>
        </div>
        <div class="text-right">
            <span class="text-3xl font-black tracking-tight {% if quality_score >= 90 %}text-emerald-400{% elif quality_score >= 70 %}text-amber-400{% else %}text-rose-400{% endif %}">
                {{ quality_score }}%
            </span>
        </div>
    </div>
    <!-- Progress Meter Bar -->
    <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 ring-1 ring-white/10">
        <div class="h-full rounded-full transition-all duration-1000 ease-out {% if quality_score >= 90 %}bg-gradient-to-r from-emerald-500 to-teal-400{% elif quality_score >= 70 %}bg-gradient-to-r from-amber-500 to-yellow-400{% else %}bg-gradient-to-r from-rose-500 to-red-400{% endif %}"
             style="width: {{ quality_score }}%"></div>
    </div>
    <!-- Footer Stats Grid -->
    <div class="grid grid-cols-3 gap-4 mt-4 pt-4 border-t border-slate-800/80 text-center">
        <div>
            <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Primary Loan Tapes</div>
            <div class="text-sm font-bold text-slate-200 mt-0.5">{{ total_raw }}</div>
        </div>
        <div>
            <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Verified Clean</div>
            <div class="text-sm font-bold text-emerald-400 mt-0.5">{{ clean_verified_count }}</div>
        </div>
        <div>
            <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Resolved Exception</div>
            <div class="text-sm font-bold text-teal-400 mt-0.5">{{ resolved_verified_count }}</div>
        </div>
    </div>
</div>
