<!-- Top Navigation Bar -->
<header class="bg-slate-900/90 border-b border-slate-800 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Brand Logo & Role Badge -->
            <div class="flex items-center gap-4 shrink-0">
                <a href="{% url 'dashboard' %}" class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-sky-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 ring-1 ring-white/20">
                        <svg class="w-6 h-6 text-white"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                            </path>
                        </svg>
                    </div>
                    <span class="text-xl font-bold text-white tracking-tight">LoanGuard AI</span>
                </a>
                <span class="px-3 py-1 rounded-full text-xs font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
                    Data Operator
                </span>
            </div>
            <!-- Header Navigation Bar Links (Flicker-Free CSS Transition) -->
            <nav class="hidden md:flex items-center gap-2">
                <button type="button"
                        onclick="switchTab('uploadTab')"
                        id="nav-uploadTab"
                        class="nav-tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-colors duration-150 flex items-center gap-2 bg-slate-800 text-white border border-slate-700">
                    <svg class="w-4 h-4 text-indigo-400"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12">
                        </path>
                    </svg>
                    File Upload
                </button>
                <button type="button"
                        onclick="switchTab('batchesTab')"
                        hx-get="{% url 'batch_list' %}"
                        hx-target="#batchesTab"
                        hx-swap="outerHTML"
                        id="nav-batchesTab"
                        class="nav-tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-colors duration-150 flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800/60 border border-transparent">
                    <svg class="w-4 h-4 text-slate-400"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                        </path>
                    </svg>
                    Batch Database
                </button>
                <button type="button"
                        onclick="switchTab('failedTab')"
                        hx-get="{% url 'failed_row_list' %}"
                        hx-target="#failedTab"
                        hx-swap="outerHTML"
                        id="nav-failedTab"
                        class="nav-tab-btn px-3.5 py-2 rounded-lg text-xs font-semibold transition-colors duration-150 flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800/60 border border-transparent">
                    <svg class="w-4 h-4 text-amber-400"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                        </path>
                    </svg>
                    Failed Rows
                    {% if total_failed_rows > 0 %}
                        <span class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">{{ total_failed_rows }}</span>
                    {% endif %}
                </button>
            </nav>
            <!-- User Profile & Logout -->
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-3 pl-3 border-l border-slate-800">
                    <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-sm font-bold text-white">
                        {{ user.first_name|default:user.username|slice:":1"|upper }}
                    </div>
                    <div class="hidden lg:block text-left">
                        <div class="text-xs font-semibold text-white">{{ user.first_name|default:user.username }} {{ user.last_name }}</div>
                        <div class="text-[10px] text-slate-400">{{ user.email|default:"operator@loanguard.ai" }}</div>
                    </div>
                </div>
                <a href="{% url 'logout' %}"
                   class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/80 transition-colors"
                   title="Sign Out">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                </a>
            </div>
        </div>
    </div>
</header>
