<!-- Stat Cards Overview Grid -->
<div id="statCardsContainer"
     class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
    <!-- Total Batches -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg backdrop-blur-xl relative overflow-hidden group hover:border-slate-700/80 transition-all">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Batches</p>
                <h3 class="text-2xl font-bold text-white mt-1">{{ total_batches }}</h3>
            </div>
            <div class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 group-hover:scale-105 transition-transform">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                    </path>
                </svg>
            </div>
        </div>
        <div class="mt-3 flex items-center text-xs text-slate-400 gap-1.5">
            <span class="text-emerald-400 font-medium flex items-center gap-0.5">
                <svg class="w-3.5 h-3.5"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
                100%
            </span>
            <span>Pipeline Ready</span>
        </div>
    </div>
    <!-- Successful Ingestion Rate -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg backdrop-blur-xl relative overflow-hidden group hover:border-slate-700/80 transition-all">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Success Rate</p>
                <h3 class="text-2xl font-bold text-white mt-1">{{ success_rate }}%</h3>
            </div>
            <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 group-hover:scale-105 transition-transform">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z">
                    </path>
                </svg>
            </div>
        </div>
        <div class="mt-3 flex items-center text-xs text-slate-400 gap-1.5">
            <span class="text-emerald-400 font-medium">Clean Records</span>
            <span>Zero data loss</span>
        </div>
    </div>
    <!-- Total Records Ingested -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg backdrop-blur-xl relative overflow-hidden group hover:border-slate-700/80 transition-all">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Raw Records</p>
                <h3 class="text-2xl font-bold text-white mt-1">{{ total_raw_records }}</h3>
            </div>
            <div class="w-12 h-12 rounded-xl bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-sky-400 group-hover:scale-105 transition-transform">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s-8-1.79-8-4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4">
                    </path>
                </svg>
            </div>
        </div>
        <div class="mt-3 flex items-center text-xs text-slate-400 gap-1.5">
            <span class="text-sky-400 font-medium">Lineage Saved</span>
            <span>Line-by-line CSV audit</span>
        </div>
    </div>
    <!-- Failed Import Rows -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg backdrop-blur-xl relative overflow-hidden group hover:border-slate-700/80 transition-all">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Failed Rows</p>
                <h3 class="text-2xl font-bold text-amber-400 mt-1">{{ total_failed_rows }}</h3>
            </div>
            <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 group-hover:scale-105 transition-transform">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                    </path>
                </svg>
            </div>
        </div>
        <div class="mt-3 flex items-center text-xs text-slate-400 gap-1.5">
            <span class="text-amber-400 font-medium">Action Required</span>
            <span>Inspect structural errors</span>
        </div>
    </div>
</div>
