<!-- Clean Navigation Tabs Bar (No Step Labels) -->
<div class="border-b border-slate-800 flex items-center gap-6 text-sm font-medium">
    <button type="button"
            onclick="switchTab('uploadTab')"
            id="subnav-uploadTab"
            class="subtab-btn active-subtab pb-3 border-b-2 font-semibold transition-colors duration-150 flex items-center gap-2 border-indigo-500 text-white">
        <svg class="w-4 h-4 text-indigo-400"
             fill="none"
             stroke="currentColor"
             viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12">
            </path>
        </svg>
        File Upload
    </button>
    <button type="button"
            onclick="switchTab('batchesTab')"
            hx-get="{% url 'batch_list' %}"
            hx-target="#batchesTab"
            hx-swap="outerHTML"
            id="subnav-batchesTab"
            class="subtab-btn pb-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-colors duration-150 flex items-center gap-2">
        <svg class="w-4 h-4 text-slate-400"
             fill="none"
             stroke="currentColor"
             viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
            </path>
        </svg>
        Batch Database
    </button>
    <button type="button"
            onclick="switchTab('failedTab')"
            hx-get="{% url 'failed_row_list' %}"
            hx-target="#failedTab"
            hx-swap="outerHTML"
            id="subnav-failedTab"
            class="subtab-btn pb-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-colors duration-150 flex items-center gap-2">
        <svg class="w-4 h-4 text-amber-400"
             fill="none"
             stroke="currentColor"
             viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
            </path>
        </svg>
        Failed Rows
        {% if total_failed_rows > 0 %}
            <span class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">{{ total_failed_rows }}</span>
        {% endif %}
    </button>
</div>
