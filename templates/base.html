{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
              content="LoanGuard AI - Credit Risk & Loan Intelligence Platform">
        <meta name="keywords"
              content="loanguard, ai, credit risk, loan intelligence, django">
        <title>
            {% block title %}
                LoanGuard AI - Risk Assessment Platform
            {% endblock title %}
        </title>
        <!-- Tailwind CSS (CDN standalone fallback for zero-config single server execution) -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Static Compiled CSS -->
        <link rel="stylesheet" href="{% static 'dist/css/output.css' %}">
        <!-- HTMX -->
        <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
        <style>
            .htmx-indicator {
                display: none !important;
            }
            .htmx-request .htmx-indicator,
            .htmx-request.htmx-indicator {
                display: block !important;
            }
            .htmx-request.htmx-indicator.flex,
            .htmx-request .htmx-indicator.flex {
                display: flex !important;
            }
            .htmx-request.htmx-indicator.inline-flex,
            .htmx-request .htmx-indicator.inline-flex {
                display: inline-flex !important;
            }
            .htmx-request.htmx-indicator.inline-block,
            .htmx-request .htmx-indicator.inline-block {
                display: inline-block !important;
            }
        </style>
    </head>
    <body class="h-full bg-slate-900 text-slate-100 font-sans antialiased">
        {% block header %}
        {% endblock header %}
        <div id="app" class="min-h-full flex flex-col">
            {% block content %}
            {% endblock content %}
        </div>
        <!-- Global Modal Container for Overlay Dialogs -->
        <div id="modal-container"></div>
        <!-- Preline UI JS -->
        <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
        <!-- Global Popover & Modal Scripts -->
        <script>
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' || e.keyCode === 27) {
                    const modal = document.getElementById('modal-container');
                    if (modal && modal.children.length > 0) {
                        modal.innerHTML = '';
                    }
                    document.querySelectorAll('.info-popover-menu').forEach(menu => {
                        menu.classList.add('hidden');
                    });
                }
            });

            window.toggleLoanInfoPopover = function(event, menuId) {
                if (event) {
                    event.stopPropagation();
                    event.preventDefault();
                }
                const targetMenu = document.getElementById(menuId);
                if (!targetMenu) return;

                const isHidden = targetMenu.classList.contains('hidden');
                document.querySelectorAll('.info-popover-menu').forEach(menu => {
                    menu.classList.add('hidden');
                });

                if (isHidden) {
                    targetMenu.classList.remove('hidden');
                }
            };

            window.copyPopoverText = function(elementId, btnElement) {
                const targetElem = document.getElementById(elementId);
                if (!targetElem) return;
                const textToCopy = targetElem.innerText.trim();
                if (!textToCopy || textToCopy === 'N/A') return;

                navigator.clipboard.writeText(textToCopy).then(() => {
                    const defaultIcon = btnElement.querySelector('.copy-default');
                    const successIcon = btnElement.querySelector('.copy-success');
                    if (defaultIcon) defaultIcon.classList.add('hidden');
                    if (successIcon) successIcon.classList.remove('hidden');

                    setTimeout(() => {
                        if (defaultIcon) defaultIcon.classList.remove('hidden');
                        if (successIcon) successIcon.classList.add('hidden');
                    }, 1500);
                }).catch(err => {
                    console.error('Clipboard copy failed:', err);
                });
            };

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.info-popover-container')) {
                    document.querySelectorAll('.info-popover-menu').forEach(menu => {
                        menu.classList.add('hidden');
                    });
                }
            });
        </script>
        {% block extrascript %}
        {% endblock extrascript %}
    </body>
</html>
