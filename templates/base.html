{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LoanGuard AI - Risk Assessment Platform{% endblock %}</title>
    <!-- Tailwind CSS (CDN standalone fallback for zero-config single server execution) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Static Compiled CSS -->
    <link rel="stylesheet" href="{% static 'dist/css/output.css' %}">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body class="h-full bg-slate-900 text-slate-100 font-sans antialiased">
    {% block header %}{% endblock header %}

    <div id="app" class="min-h-full flex flex-col">
        {% block content %}{% endblock content %}
    </div>

    <!-- Preline UI JS -->
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    {% block extrascript %}{% endblock extrascript %}
</body>
</html>
