<!-- Reusable Filter Dropdown Widget Component -->
<select name="{{ name }}"
        id="{{ id }}"
        class="px-3.5 py-2 bg-slate-950/80 border {% if selected_value %}border-{{ accent_color|default:'indigo' }}-500/50 text-{{ accent_color|default:'indigo' }}-300{% else %}border-slate-800 text-slate-300{% endif %} rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-{{ accent_color|default:'indigo' }}-500 {{ extra_classes|default:'' }}">
    <option value="">{{ default_label|default:'All' }}</option>
    {% for item in options %}
        {% if item.id %}
            <option value="{{ item.id }}"
                    {% if selected_value == item.id|stringformat:"s" %}selected{% endif %}>
                Batch #{{ item.id }} - {{ item.file_name|default:"Unnamed File" }}
            </option>
        {% elif item.0 != None %}
            <option value="{{ item.0 }}"
                    {% if selected_value == item.0|stringformat:"s" %}selected{% endif %}>{{ item.1 }}</option>
        {% else %}
            <option value="{{ item }}"
                    {% if selected_value == item|stringformat:"s" %}selected{% endif %}>{{ item }}</option>
        {% endif %}
    {% endfor %}
</select>
