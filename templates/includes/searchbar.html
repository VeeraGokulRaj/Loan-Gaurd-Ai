<!-- Reusable Searchbar Widget Component -->
<div class="relative flex items-center">
    <input type="text"
           name="{{ name|default:'q' }}"
           id="{{ id }}"
           value="{{ value|default:'' }}"
           placeholder="{{ placeholder|default:'Search...' }}"
           class="w-64 px-3.5 py-2 bg-slate-950/80 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-{{ accent_color|default:'indigo' }}-500 text-xs {{ extra_classes|default:'' }}">
    <!-- HTMX Inline Search Loading Indicator -->
    <div class="htmx-indicator inline-flex ml-2 items-center gap-1.5 text-[11px] text-slate-400 font-medium">
        <svg class="w-3.5 h-3.5 animate-spin text-{{ accent_color|default:'indigo' }}-400"
             fill="none"
             viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
        </svg>
    </div>
</div>
