{% if messages %}
    <div class="space-y-3">
        {% for message in messages %}
            {% if "error" in message.tags or "danger" in message.tags %}
                <div class="message-banner rounded-xl bg-red-500/10 border border-red-500/20 p-4 text-sm text-red-300 flex items-center justify-between backdrop-blur-md shadow-lg">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-red-400 shrink-0"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                            </path>
                        </svg>
                        <span class="font-semibold">{{ message }}</span>
                    </div>
                    <button type="button"
                            onclick="this.closest('.message-banner').remove()"
                            class="text-red-400 hover:text-red-200 transition-colors p-1 rounded-lg hover:bg-red-500/10 shrink-0"
                            title="Dismiss message">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            {% elif "warning" in message.tags %}
                <div class="message-banner rounded-xl bg-amber-500/10 border border-amber-500/20 p-4 text-sm text-amber-300 flex items-center justify-between backdrop-blur-md shadow-lg">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-amber-400 shrink-0"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                            </path>
                        </svg>
                        <span class="font-semibold">{{ message }}</span>
                    </div>
                    <button type="button"
                            onclick="this.closest('.message-banner').remove()"
                            class="text-amber-400 hover:text-amber-200 transition-colors p-1 rounded-lg hover:bg-amber-500/10 shrink-0"
                            title="Dismiss message">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            {% else %}
                <div class="message-banner rounded-xl bg-emerald-500/10 border border-emerald-500/20 p-4 text-sm text-emerald-300 flex items-center justify-between backdrop-blur-md shadow-lg">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-emerald-400 shrink-0"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z">
                            </path>
                        </svg>
                        <span class="font-semibold">{{ message }}</span>
                    </div>
                    <button type="button"
                            onclick="this.closest('.message-banner').remove()"
                            class="text-emerald-400 hover:text-emerald-200 transition-colors p-1 rounded-lg hover:bg-emerald-500/10 shrink-0"
                            title="Dismiss message">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            {% endif %}
        {% endfor %}
    </div>
{% endif %}
